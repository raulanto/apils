[project]
name = "apils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raul antonio de la cruz hernandez", email = "detretaty@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[project.scripts]
apils = "apils:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
